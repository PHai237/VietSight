# VietSight V1 — First Gear: baseline from normalised public data. Goal: a VALID checkpoint early.
# Built on Kaggle by notebooks/kaggle/prep/VietSight_prep_kaggle.ipynb (fetch caps: training=1700, validation=300).
name: vietsight_v1
description: >-
  Mapillary Vistas v2 subset (~2k images; all 11 classes labelled; layered polygons -> visible masks). Images with
  two-wheelers / riders / other vehicles always selected, other images sampled (hash, 15%).
  Val = the selected images of Mapillary's OFFICIAL validation split (disjoint from training by construction).
sources:
  - name: mapillary_vistas
val:
  frozen_list: configs/val_frozen.txt   # created by the first build, then FIXED for every version
  from_sources: [mapillary_vistas]
  orig_prefix: "validation/"
dedup:
  hamming: 2
